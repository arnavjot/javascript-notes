<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="color: #212121;">
    <p>0 UNSENT Client has been created. open() not called yet.</p>
    <p>1 OPENED open() has been called.</p>
    <p>2 HEADERS_RECEIVED send() has been called, and headers and status are available.</p>
    <p>3 LOADING Downloading; responseText holds partial data.</p>
    <p>4 DONE The operation is complete.</p>
</body>
<script>
    const requestUrl = 'https://api.github.com/users/arnavjot'
    const xhr = new XMLHttpRequest();
    // console.log(xhr.readyState);
    xhr.open('GET', requestUrl) // sends request
    // console.log(xhr.readyState);
    xhr.onreadystatechange = function () {
        console.log(xhr.readyState);
        if (xhr.readyState === 4) {
            // const data = JSON.parse(xhr.responseText)
            const data = JSON.parse(this.responseText) //convert from string to JSON object
            console.log(typeof data);
            console.log(data.followers);

            const user = {
                username: data.name,
                photo: data.avatar_url
            }
            
            const img = document.createElement('img');
            img.src = user.photo; 
            document.body.appendChild(img);

            const p = document.createElement('p')
            p.appendChild(document.createTextNode(data.name))
            document.body.appendChild(p)
        }
    }
    xhr.send();
</script>

</html>
